<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cric Journal – Live Cricket Scores</title>
  <meta name="description" content="Live cricket scores, ball-by-ball commentary, scorecards, series, teams, rankings and news.">
  <meta name="theme-color" content="#0b7a5a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cric Journal">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="logo" aria-label="Cric Journal home">
        <svg viewBox="0 0 512 512" aria-hidden="true"><circle cx="256" cy="256" r="230" fill="#fff"/><circle cx="256" cy="256" r="170" fill="#d8322a"/><path d="M180 140c45 70 45 162 0 232M332 140c-45 70-45 162 0 232" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/></svg>
        <span>Cric Journal</span>
      </a>
      <nav class="topnav" aria-label="Main">
        <a href="/" data-nav="home">Home</a>
        <a href="/matches" data-nav="matches">Matches</a>
        <a href="/series" data-nav="series">Series</a>
        <a href="/teams" data-nav="teams">Teams</a>
        <a href="/rankings" data-nav="rankings">Rankings</a>
        <a href="/news" data-nav="news">News</a>
      </nav>
      <form class="search" role="search" id="search-form">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search-input" type="search" placeholder="Search players, teams, series" aria-label="Search" autocomplete="off">
      </form>
      <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>
  <div class="strip" id="live-strip" hidden><div class="strip-inner" id="live-strip-inner"></div></div>
  <main id="app" tabindex="-1"><div class="skeleton"></div></main>
  <footer class="footer">
    Cric Journal · Demo data is simulated · <a href="/docs">API &amp; MCP docs</a>
  </footer>
  <nav class="bottomnav" aria-label="Mobile">
    <a href="/" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="/matches" data-nav="matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 5c3 4 3 10 0 14M16 5c-3 4-3 10 0 14"/></svg>Matches</a>
    <a href="/series" data-nav="series"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Series</a>
    <a href="/rankings" data-nav="rankings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>Rankings</a>
    <a href="/news" data-nav="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>News</a>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
